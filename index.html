<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>班级生日祝福 · 管理后台</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;
--txt:#e6e8ec;--dim:#9aa3b2;--acc:#4f8cff;--ok:#3ecf8e;--warn:#ffb454;--err:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:var(--panel);
border-bottom:1px solid var(--line);padding:10px 14px;
display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .sp{flex:1}
.tag{font-size:12px;color:var(--dim);background:var(--panel2);
border:1px solid var(--line);border-radius:999px;padding:3px 10px}
main{padding:14px;max-width:1100px;margin:0 auto}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 14px 0;background:var(--panel)}
nav button{background:none;border:none;color:var(--dim);padding:10px 14px;
font-size:14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--txt);border-bottom-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);
border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
label{font-size:13px;color:var(--dim);display:block;margin-bottom:4px}
input,select,textarea,button{font-family:inherit;font-size:14px}
input[type=text],input[type=password],input[type=number],select,textarea{
background:var(--panel2);border:1px solid var(--line);color:var(--txt);
border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.7}
button{background:var(--acc);border:none;color:#fff;border-radius:8px;
padding:9px 16px;cursor:pointer;font-weight:500}
button:disabled{opacity:.5;cursor:not-allowed}
button.gh{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
button.danger{background:var(--err)}
button.sm{padding:6px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
overflow:hidden;cursor:pointer;position:relative;aspect-ratio:9/16}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .lb{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;
font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.75));
color:#fff;display:flex;justify-content:space-between}
.thumb .ph{display:flex;height:100%;align-items:center;justify-content:center;
color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:500;font-size:12px}
td input{padding:6px 8px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
display:flex;align-items:center;justify-content:center;padding:14px}
.mask .box{background:var(--panel);border:1px solid var(--line);
border-radius:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.mask .box img{width:100%;border-radius:10px;display:block;margin-bottom:12px}
.close{float:right;background:none;color:var(--dim);font-size:22px;padding:0 4px}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.err{color:var(--err);font-size:13px}
.ok{color:var(--ok);font-size:13px}
.switch{display:flex;align-items:center;gap:9px;padding:9px 0;
border-bottom:1px solid var(--line)}
.switch:last-child{border:none}
.switch .t{flex:1;font-size:14px}
.switch .d{font-size:12px;color:var(--dim)}
.toggle{width:46px;height:26px;border-radius:999px;background:var(--line);
position:relative;cursor:pointer;flex:none;transition:.2s}
.toggle.on{background:var(--ok)}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;
border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{left:23px}
.run{display:flex;justify-content:space-between;padding:8px 0;
border-bottom:1px solid var(--line);font-size:13px}
.run:last-child{border:none}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat div{background:var(--panel2);border:1px solid var(--line);
border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
background:var(--panel2);border:1px solid var(--line);border-radius:10px;
padding:11px 18px;z-index:99;font-size:14px;display:none;max-width:90vw}
</style>
</head>
<body>

<header>
  <h1>🎂 班级生日祝福</h1>
  <span class="tag" id="repoTag">未连接</span>
  <span class="sp"></span>
  <button class="gh sm" id="btnRefresh">刷新</button>
  <button class="gh sm" id="btnLogout">退出</button>
</header>

<nav>
  <button data-tab="home" class="on">概览</button>
  <button data-tab="roster">名单</button>
  <button data-tab="cards">贺卡</button>
  <button data-tab="settings">设置</button>
  <button data-tab="gen">生成</button>

<main id="main"></main>

<div class="mask" id="login">
  <div class="box">
    <h2 style="margin:0 0 6px">登录管理后台</h2>
    <p class="hint" style="margin-top:0">
      用 GitHub 账号授权。需要一个 <b>Personal Access Token</b>：
      GitHub 网页 → 右上角头像 → <b>Settings</b> → 最下方
      <b>Developer settings</b> → <b>Personal access tokens → Fine-grained tokens</b>
      → <b>Generate new token</b> → 只选你这一个仓库 →
      Permissions 里把 <b>Contents</b> 和 <b>Actions</b> 设为 <b>Read and write</b>。
    </p>
    <div style="margin-top:14px">
      <label>Token（github_pat_ 开头）</label>
      <input type="password" id="tk" placeholder="粘贴后只保存在本机浏览器">
    </div>
    <div class="row" style="margin-top:10px">
      <div style="flex:1"><label>用户名</label><input type="text" id="owner" placeholder="fcy2025"></div>
      <div style="flex:1"><label>仓库名</label><input type="text" id="repo" value="qq-birthday-bot"></div>
    </div>
    <div><label>分支</label><input type="text" id="branch" value="master"></div>
    <div class="row" style="margin-top:14px">
      <button id="btnLogin">连接</button>
      <button class="gh" id="btnGuess">自动填用户名</button>
    </div>
    <p class="hint">Token 只存在这台设备的浏览器里，不会上传给任何人。</p>
  </div>
</div>

<div class="mask" id="modal" style="display:none">
  <div class="box" id="modalBox"></div>
</div>

<div id="toast"></div>

<script>
/* ─────────────────────────────────────────────────────
   农历换算（1900-2100），内联，不依赖外部 CDN
   ─────────────────────────────────────────────────────
   数据表由权威农历库 lunar-python 逐月实测生成：
   遍历 1900-2100 每一年，用「该月是否存在三十日」判定大小月，
   用「负月份是否可构造」判定闰月及其位置。

   编码（与通行实现一致）：
     bits 0-3   闰月月份（0 = 无闰月）
     bit  16    闰月是否为大月（30 天）
     bit (16-m) 第 m 月是否为大月

   已核对的闰月年：2023闰二月、2025闰六月、2028闰五月、
   2033闰冬月、2017闰六月、2020闰四月、2014闰九月、2012闰四月
   ───────────────────────────────────────────────────── */
var LUNAR_INFO = [
0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
0x06566,0x0d4a0,0x0ea50,0x16a95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
0x0d520
];

function lLeapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function lLeapDays(y){ return lLeapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29) : 0; }
function lMonthDays(y,m){ return (LUNAR_INFO[y-1900] & (0x10000>>m)) ? 30 : 29; }
function lYearDays(y){
  var sum = 348;                       // 12 × 29
  for (var i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0;
  return sum + lLeapDays(y);
}

var LUNAR_BASE = Date.UTC(1900, 0, 31);   // 1900-01-31 = 农历1900年正月初一
var CN_NUM  = ['零','一','二','三','四','五','六','七','八','九','十'];
var CN_MON  = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var CN_DAY1 = ['初','十','廿','三'];

function cnMonth(m, isLeap){
  if (m === 1) return '正';
  if (m === 11) return '冬';
  if (m === 12) return '腊';
  return CN_NUM[m];
}
function cnDay(d){
  if (d === 10) return '初十';
  if (d === 20) return '二十';
  if (d === 30) return '三十';
  return CN_DAY1[Math.floor(d/10)] + CN_NUM[d%10];
}

/* 公历 → 农历 */
function solar2lunar(y, m, d){
  if (y < 1900 || y > 2100) return -1;
  var offset = Math.floor((Date.UTC(y, m-1, d) - LUNAR_BASE) / 86400000);
  if (offset < 0) return -1;
  var i, temp = 0;
  for (i = 1900; i < 2101 && offset > 0; i++){ temp = lYearDays(i); offset -= temp; }
  if (offset < 0){ offset += temp; i--; }
  var year = i;
  var leap = lLeapMonth(year), isLeap = false;
  for (i = 1; i < 13 && offset > 0; i++){
    if (leap > 0 && i === (leap + 1) && !isLeap){ --i; isLeap = true; temp = lLeapDays(year); }
    else { temp = lMonthDays(year, i); }
    if (isLeap && i === (leap + 1)) isLeap = false;
    offset -= temp;
  }
  if (offset === 0 && leap > 0 && i === leap + 1){
    if (isLeap){ isLeap = false; } else { isLeap = true; --i; }
  }
  if (offset < 0){ offset += temp; --i; }
  return { year: year, month: i, day: offset + 1, isLeap: isLeap,
           monthCn: (isLeap ? '闰' : '') + cnMonth(i) + '月',
           dayCn: cnDay(offset + 1) };
}

/* 农历 → 公历 */
function lunar2solar(y, m, d, isLeap){
  if (y < 1900 || y > 2100) return -1;
  isLeap = !!isLeap;
  if (isLeap && lLeapMonth(y) !== m) return -1;   // 该年 m 月不是闰月
  if (d > lMonthDays(y, m)) return -1;            // 该月没有这一天
  var offset = 0, i;
  for (i = 1900; i < y; i++) offset += lYearDays(i);
  for (i = 1; i < m; i++){
    offset += lMonthDays(y, i);
    if (lLeapMonth(y) === i) offset += lLeapDays(y);   // 闰 i 月紧跟 i 月之后
  }
  if (isLeap) offset += lMonthDays(y, m);         // 闰 m 月前面还有正常 m 月
  offset += d - 1;
  var dt = new Date(LUNAR_BASE + offset * 86400000);
  return { year: dt.getUTCFullYear(), month: dt.getUTCMonth() + 1, day: dt.getUTCDate() };
}

/* 给定农历月日，求某年对应的公历日期。
   该年没有三十就回退到廿九；闰月在该年不存在就回退到正常月。 */
function lunarBirthdayInYear(m, d, isLeap, y){
  var tries = [[m, d, isLeap]];
  if (d >= 30) tries.push([m, 29, false === isLeap ? false : isLeap]);
  if (isLeap) tries.push([m, d, false]);
  if (d >= 30 && isLeap) tries.push([m, 29, false]);
  for (var i = 0; i < tries.length; i++){
    var r = lunar2solar(y, tries[i][0], tries[i][1], tries[i][2]);
    if (r !== -1) return r;
  }
  return null;
}


const API='https://api.github.com';
let S={tk:'',owner:'',repo:'',branch:'master'};
let CACHE={};

/* ---------- 基础 ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;
  t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2600);}
function save(){localStorage.setItem('bday_admin',JSON.stringify(S));}
function addDiag(msg){
  const box=document.querySelector('#login .box');
  if(document.getElementById('diag'))document.getElementById('diag').remove();
  const d=document.createElement('div');
  d.id='diag';
  d.style.cssText='margin-top:12px;padding:10px 12px;background:#2a1f1f;border:1px solid #5a3030;border-radius:8px;font-size:13px;line-height:1.7';
  let tip='';
  if(/401|Bad credentials/.test(msg))
    tip='令牌不对或没复制完整。<br>建议：<b>改用「自动填用户名」按钮测试</b>——它也报 401 就说明令牌本身有问题。';
  else if(/404/.test(msg))
    tip='仓库名/用户名/分支不对，或令牌没权限访问这个仓库。';
  d.innerHTML='<b style="color:#ff6b6b">'+msg+'</b><br>'+tip;
  box.appendChild(d);
}
function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('bday_admin')||'{}'))}catch(e){}}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';
  for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function b64dec(b64){const bin=atob(b64.replace(/\n/g,''));const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b);}

async function gh(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{
    Authorization:'Bearer '+S.tk,Accept:'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  if(!r.ok){let m=r.status+' ';try{m+=(await r.json()).message}catch(e){m+=await r.text()}
    throw new Error(m);}
  return r.status===204?null:r.json();
}
const P=p=>encodeURIComponent(p).replace(/%2F/g,'/');
async function getFile(path){
  const d=await gh(`/repos/${S.owner}/${S.repo}/contents/${P(path)}?ref=${S.branch}`);
  if(Array.isArray(d))throw new Error('这是目录不是文件');
  return {text:b64dec(d.content),sha:d.sha};
}
async function putFile(path,text,msg){
  let sha;try{sha=(await getFile(path)).sha}catch(e){}
  return gh(`/repos/${S.owner}/${S.repo}/contents/${P(path)}`,{method:'PUT',
    body:JSON.stringify({message:msg,content:b64enc(text),sha,branch:S.branch})});
}
async function delFile(path){
  const {sha}=await getFile(path);
  return gh(`/repos/${S.owner}/${S.repo}/contents/${P(path)}`,{method:'DELETE',
    body:JSON.stringify({message:'删除 '+path,sha,branch:S.branch})});
}
async function listDir(path){
  try{return await gh(`/repos/${S.owner}/${S.repo}/contents/${P(path)}?ref=${S.branch}`)}
  catch(e){return []}
}
async function dispatch(wf,inputs){
  return gh(`/repos/${S.owner}/${S.repo}/actions/workflows/${wf}/dispatches`,
    {method:'POST',body:JSON.stringify({ref:S.branch,inputs})});
}
async function runs(){
  try{const d=await gh(`/repos/${S.owner}/${S.repo}/actions/runs?per_page=8`);
    return d.workflow_runs||[]}catch(e){return[]}
}

/* ---------- 配置读写 ---------- */
let cfgText='';
async function getCfg(){if(!cfgText)cfgText=(await getFile('config.yaml')).text;return cfgText}
function cfgGet(key){
  const m=cfgText.match(new RegExp('^\\s*'+key+'\\s*:\\s*(.+)$','m'));
  return m?m[1].trim():'';
}
function cfgSet(key,val){
  const re=new RegExp('^(\\s*'+key+'\\s*:\\s*)(.+)$','m');
  if(re.test(cfgText))cfgText=cfgText.replace(re,'$1'+val);
  return cfgText;
}
async function saveCfg(msg){
  await putFile('config.yaml',cfgText,'更新配置：'+msg);
  toast('配置已保存 ✓');
}

/* ---------- 标签页 ---------- */
let TAB='home';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render();});

async function render(){
  const m=document.getElementById('main');
  m.innerHTML='<div class="card">载入中…</div>';
  try{
    if(TAB==='home')m.innerHTML=await vHome();
    if(TAB==='roster')await vRoster(m);
    if(TAB==='cards')await vCards(m);
    if(TAB==='settings')await vSettings(m);
    if(TAB==='gen')await vGen(m);
    if(TAB==='help')m.innerHTML=vHelp();
  }catch(e){m.innerHTML='<div class="card err">载入失败：'+e.message+'</div>'}
}

async function vHome(){
  const rs=await runs();
  const cards=await listDir('cards');
  const years={};
  cards.forEach(f=>{const y=(f.name.split('_')[0]||'');if(/^\d{4}$/.test(y))years[y]=(years[y]||0)+1});
  const roster=await getFile('data/birthdays.csv').catch(()=>({text:''}));
  const n=roster.text.trim().split('\n').length-1;
  const yl=Object.keys(years).sort().map(y=>`<div><b>${years[y]}</b><span>${y} 年</span></div>`).join('')||'<div><b>0</b><span>暂无贺卡</span></div>';
  const rl=rs.map(r=>{
    const c=r.status==='completed'?(r.conclusion==='success'?'var(--ok)':'var(--err)'):'var(--warn)';
    return `<div class="run"><span>${r.name}</span>
      <span style="color:${c}">${r.status==='completed'?r.conclusion:r.status} ·

/* CSV 列：姓名,出生日期,过生日,性别,备注
   内部数组：[姓名, 出生日期, 过生日, 性别, 备注]
   兼容旧格式：姓名,生日,历法,性别,备注 */
function parseCSV(t){
  const L=t.replace(/^\uFEFF/,'').trim().split('\n');
  const head=(L[0]||'').split(',').map(x=>x.trim());
  const iBirth=head.indexOf('出生日期')>=0?head.indexOf('出生日期'):head.indexOf('生日');
  const iCal=head.indexOf('过生日')>=0?head.indexOf('过生日'):head.indexOf('历法');
  const iG=head.indexOf('性别');
  const iN=head.indexOf('备注');
  return L.slice(1).map(l=>{
    const c=l.split(',');
    return [
      c[0]||'',
      (iBirth>=0?c[iBirth]:c[1])||'',
      normCal((iCal>=0?c[iCal]:c[2])||'公历'),
      (iG>=0?c[iG]:'')||'',
      (iN>=0?c[iN]:(c[3]||''))||'',
    ];
  });
}
function normCal(v){
  v=(v||'').trim();
  return (v==='农历'||v==='阴历')?'农历':'公历';
}
function toCSV(rows){
  return '姓名,出生日期,过生日,性别,备注\n'
    +rows.map(r=>[r[0],r[1],r[2],r[3]||'',r[4]||''].join(',')).join('\n')+'\n';
}

/* 把 "2011-04-16" / "2011/4/16" 解析成 [y,m,d] */
function parseDate(v){
  if(!v)return null;
  const m=String(v).match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(!m)return null;
  return [+m[1],+m[2],+m[3]];
}
function fmtMD(d){return d.month+'-'+String(d.day).padStart(2,'0');}

/* 计算这一行的换算结果 + 未来三年发送日期 */
function calcRow(r){
  const dt=parseDate(r[1]);
  const cal=r[2];
  if(!dt){
    // 只有月日（如 "08-15"）：公历生日够用，农历生日必须补年份
    if(cal==='农历')
      return '<span style="color:var(--err)">农历生日需要完整出生日期<br>（含年份，如 2011-04-16）</span>';
    return '<span style="color:var(--dim)">—</span>';
  }
  const [y,mo,d]=dt;
  if(cal==='公历'){
    return `<b>公历 ${mo}月${d}日</b><br>
      <span style="color:var(--dim)">每年固定这天</span>`;
  }
  const l=solar2lunar(y,mo,d);
  if(l===-1)return '<span style="color:var(--err)">换算失败</span>';
  const now=new Date().getFullYear();
  let pre=[];
  for(const yy of [now,now+1,now+2]){
    const s=lunarBirthdayInYear(l.month,l.day,l.isLeap,yy);
    pre.push(s?(String(s.month).padStart(2,'0')+'-'+String(s.day).padStart(2,'0')):'—');
  }
  return `<b>农历 ${l.monthCn}${l.dayCn}</b><br>
    <span style="color:var(--dim)">${now}/${now+1}/${now+2} 年发送：<br>
    ${pre.join(' · ')}</span>`;
}

         data-i="${i}" data-f="1"></td>
    <td><select data-i="${i}" data-f="2">
      <option value="公历"${r[2]!=='农历'?' selected':''}>公历</option>
      <option value="农历"${r[2]==='农历'?' selected':''}>农历</option></select></td>
    <td><select data-i="${i}" data-f="3">
      <option value=""${r[3]!=='男'&&r[3]!=='女'?' selected':''}>未填</option>
      <option value="男"${r[3]==='男'?' selected':''}>男</option>
      <option value="女"${r[3]==='女'?' selected':''}>女</option></select></td>
    <td style="font-size:12px;line-height:1.5" id="calc${i}">${calcRow(r)}</td>

function fmt(p){return p[0]+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0');}

function updStat(){
  const el=document.getElementById('rst');
  if(!el)return;
  let noDate=0,lunar=0,noGender=0,bad=0,noYear=0;
  rosterRows.forEach(r=>{
    if(!parseDate(r[1])){
      noDate++;
      if(r[2]==='农历')noYear++;
    }
    if(r[2]==='农历')lunar++;
    if(r[3]!=='男'&&r[3]!=='女')noGender++;
    if(parseDate(r[1])&&r[2]==='农历'){
      const p=parseDate(r[1]);
      if(solar2lunar(p[0],p[1],p[2])===-1)bad++;
    }
  });
  const parts=[];
  if(noDate)parts.push(`<span style="color:var(--warn)">${noDate} 人没填出生日期</span>`);
  if(lunar)parts.push(`过农历 ${lunar} 人`);
  if(noGender)parts.push(`性别未填 ${noGender} 人（留空则不用他/她）`);
  if(bad)parts.push(`<span style="color:var(--err)">${bad} 人换算失败</span>`);
  if(noYear)parts.push(`<span style="color:var(--err)">${noYear} 人过农历但出生日期缺年份，必须补全</span>`);
  el.innerHTML=parts.length?parts.join(' ｜ '):
    `<span style="color:var(--ok)">✓ ${rosterRows.length} 人信息完整</span>`;
}

let io=null;
function lazy(){
  if(!io){io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){const el=e.target;io.unobserve(el);loadThumb(el)}}),{rootMargin:'300px'})}
  document.querySelectorAll('.ph[data-src]').forEach(el=>io.observe(el));
}
async function loadThumb(el){
  const src=el.dataset.src;delete el.dataset.src;
  try{const d=await gh(`/repos/${S.owner}/${S.repo}/contents/${P(src)}?ref=${S.branch}`);
    const im=new Image();im.src='data:image/jpeg;base64,'+d.content;

    el.replaceWith(im);

}

    <div class="hint">52 人 × 2 场景约 20～40 分钟。跑完点下面的「刷新」看状态，
      或去 Actions 页面看日志、下载贺卡。</div></div>

  <div class="card"><h2>🧹 清理产物</h2>
    <div class="row">
      <div style="flex:1"><label>清理哪个年份</label>
        <select id="cYear">
          <option value="all">全部年份</option>
          ${yearsAll.map(y=>`<option>${y}</option>`).join('')}
          ${[y,y+1,y+2].filter(v=>!yearsAll.includes(String(v))).map(v=>`<option>${v}</option>`).join('')}
        </select></div>
      <div style="flex:2"><label>&nbsp;</label>
        <button class="danger" onclick="runClean()">清空</button></div></div>
    <div class="hint">
      <b>直接删，秒级生效，不用等 Actions。</b>
      删的是选中年头的 <code>cards/</code>、<code>data/copy/</code>、
      <code>data/img/</code> 里 <code>年份_姓名_场景</code> 格式的文件。<br>
      <b>名单（birthdays.csv）不受影响。</b></div></div>

  <div class="card"><h2>其它任务</h2>
    <div class="row">
      <button class="gh" onclick="runRaw('rebuild')">重新合成全部（按现有文案）</button>
      <button class="gh" onclick="runRaw('dry')">演练一次（只打印不真发）</button>
      <button class="gh" onclick="runRaw('send')">立即发送（到点的才发）</button></div></div>

  <div class="card"><h2>运行记录</h2><div id="runlist">载入中…</div>
    <div class="row" style="margin-top:10px"><button class="gh sm" onclick="render()">刷新</button></div></div>`;
  paintRuns(rs);
}
async function paintRuns(rs){
  const el=document.getElementById('runlist');if(!el)return;
  el.innerHTML=rs.map(r=>{const c=r.status==='completed'?(r.conclusion==='success'?'var(--ok)':'var(--err)'):'var(--warn)';
    return `<div class="run"><span>${r.name}<br><span class="hint">${r.display_title||''}</span></span>
      <span style="color:${c};text-align:right">${r.status==='completed'?r.conclusion:r.status}<br>
      <span class="hint">${new Date(r.created_at).toLocaleString('zh-CN')}</span></span></div>`}).join('')
    ||'<div class="hint">暂无记录</div>';
}
async function runGen(){
  const y=document.getElementById('gYear').value,sc=document.getElementById('gScene').value;
  const cl=document.getElementById('gClean')?.checked?'true':'false';
  await dispatch('daily.yml',{mode:'generate',year:y,scene:sc,target:'',clean:cl});
  toast(cl==='true'?('已清空并重生成 '+y+' 年'):('已启动 '+y+' 年生成'))
  setTimeout(render,1500);
}
/* 用 Git Trees API 批量删除：一次提交搞定，秒级生效。
   不走 GitHub Actions —— Actions 的 git 回写有个坑：
   `git pull --rebase -X ours` 在 rebase 语义下保留的是远程版本，
   会把刚删掉的文件全部复活（日志显示删了 229 个，仓库里一个没少）。
   直接从 API 删，绕开整个 git 冲突流程，彻底杜绝这个问题。 */
async function deletePaths(paths){
  const ref=`heads/${S.branch}`;
  let parent=null;
  // 每批 100 个，避免单次请求过大
  for(let i=0;i<paths.length;i+=100){
    const batch=paths.slice(i,i+100);
    const refData=await gh(`/repos/${S.owner}/${S.repo}/git/ref/${ref}`);
    parent=refData.object.sha;
    const baseCommit=await gh(`/repos/${S.owner}/${S.repo}/git/commits/${parent}`);
    // sha:null = 删除该路径
    const tree=batch.map(p=>({path:p,mode:'100644',type:'blob',sha:null}));
    const newTree=await gh(`/repos/${S.owner}/${S.repo}/git/trees`,{method:'POST',
      body:JSON.stringify({base_tree:baseCommit.tree.sha,tree})});
    const newCommit=await gh(`/repos/${S.owner}/${S.repo}/git/commits`,{method:'POST',
      body:JSON.stringify({message:`清理生日贺卡产物 (${i+1}-${i+batch.length})`,
        tree:newTree.sha,parents:[parent]})});
    await gh(`/repos/${S.owner}/${S.repo}/git/refs/${ref}`,{method:'PATCH',
      body:JSON.stringify({sha:newCommit.sha})});
  }
  return parent;
}

async function runClean(){
  const y=document.getElementById('cYear').value;
  const label=(y==='all')?'全部年份':(y+' 年');
  if(!confirm('确定清空「'+label+'」的产物吗？\n\n'+
    '将删除该年份的贺卡、文案、配图。\n名单(birthdays.csv)不受影响。\n\n'+
    '此操作不可撤销。'))return;

  const btn=document.querySelector('[onclick="runClean()"]');
  if(btn){btn.disabled=true;btn.textContent='清理中…';}
  try{
    // 收集三个目录下符合条件的文件
    const dirs=['cards','data/copy','data/img'];
    let paths=[];
    for(const d of dirs){
      const fs=await listDir(d);
      for(const f of fs){
        if(f.type!=='file')continue;
        // 只匹配「年份_姓名_场景」格式，README.md 等不会被误删
        const hit=(y==='all') ? /^\d{4}_/.test(f.name) : f.name.startsWith(y+'_');
        if(!hit)continue;
        paths.push(d+'/'+f.name);
      }
    }
    if(!paths.length){toast('没有找到可清理的文件');return;}
    if(!confirm(`将删除 ${paths.length} 个文件，继续？`))return;
    await deletePaths(paths);
    toast(`✅ 已删除 ${paths.length} 个文件，刷新页面查看`);
    setTimeout(()=>location.reload(),1200);
  }catch(e){
    toast('清理失败：'+e.message);
    console.error(e);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='清空';}
  }
}
async function runRaw(mode){
  await dispatch('daily.yml',{mode,scene:'both',year:'',target:'',clean:'false'});
  toast('已启动：'+mode);setTimeout(render,1500);
}

document.getElementById('btnLogin').onclick=async()=>{
  // 手机粘贴长令牌时常混入换行/空格，一律剔除
  S.tk=document.getElementById('tk').value.replace(/\s/g,'');
  S.owner=document.getElementById('owner').value.trim();
  S.repo=document.getElementById('repo').value.trim();
  S.branch=document.getElementById('branch').value.trim()||'master';
  if(!S.tk||!S.owner)return toast('Token 和用户名必填');
  if(!/^(github_pat_|ghp_|gho_|ghu_|ghs_)/.test(S.tk))
    toast('令牌格式不对（应以 github_pat_ 开头），多半是复制时被截断了');
  document.getElementById('btnLogin').disabled=true;
  document.getElementById('btnLogin').textContent='连接中…';
  try{await gh('/user');save();document.getElementById('login').style.display='none';
    document.getElementById('repoTag').textContent=S.owner+'/'+S.repo;render();}
  catch(e){
    document.getElementById('btnLogin').disabled=false;
    document.getElementById('btnLogin').textContent='连接';
    toast('连接失败：'+e.message);
    addDiag(e.message);}
};
document.getElementById('btnGuess').onclick=async()=>{
  const t=document.getElementById('tk').value.replace(/\s/g,'');
  if(!t)return toast('先填 Token');
  try{const u=await fetch(API+'/user',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json());
    document.getElementById('owner').value=u.login||'';toast('已填入：'+u.login)}
  catch(e){toast('Token 可能无效')}
};

}
